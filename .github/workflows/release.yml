name: Build and publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  macos:
    uses: ./.github/workflows/macos.yml
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release version and notes
        run: |
          test "$GITHUB_REF_NAME" = "v$(python -c 'from cleaner import __version__; print(__version__)')"
          test -s "docs/releases/$GITHUB_REF_NAME.md"
      - name: Download and verify all three packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name windows-x64 --name macos-arm64 --name macos-x86_64 --dir artifacts
          mkdir release
          for artifact in windows-x64 macos-arm64 macos-x86_64; do
            (cd "artifacts/$artifact" && sha256sum --check SHA256SUMS.txt)
            cp "artifacts/$artifact/"*.zip release/
          done
          cd release
          test -s AIConversationCleaner-Windows-x64.zip
          test -s AIConversationCleaner-macOS-arm64.zip
          test -s AIConversationCleaner-macOS-x86_64.zip
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish the public preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --verify-tag --prerelease --title "$GITHUB_REF_NAME — Windows & macOS" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
